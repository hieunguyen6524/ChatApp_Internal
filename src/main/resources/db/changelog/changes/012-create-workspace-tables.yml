databaseChangeLog:
  - changeSet:
      id: 012-create-workspace-tables
      author: developer
      changes:
        # Workspace roles table
        - createTable:
            tableName: workspace_roles
            columns:
              - column:
                  name: ws_role_id
                  type: INT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: role_name
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: description
                  type: VARCHAR(255)

            modifySql:
              dbms: mysql
              append:
                value: " ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"

        - insert:
            tableName: workspace_roles
            columns:
              - column:
                  name: role_name
                  value: ADMIN
        - insert:
            tableName: workspace_roles
            columns:
              - column:
                  name: role_name
                  value: MEMBER
        - insert:
            tableName: workspace_roles
            columns:
              - column:
                  name: role_name
                  value: GUEST

        # Workspaces table
        - createTable:
            tableName: workspaces
            columns:
              - column:
                  name: workspace_id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: name
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: description
                  type: TEXT
              - column:
                  name: created_by
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: is_archived
                  type: BOOLEAN
                  defaultValueBoolean: false
              - column:
                  name: created_at
                  type: BIGINT
              - column:
                  name: updated_at
                  type: BIGINT
            modifySql:
              dbms: mysql
              append:
                value: " ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"

        - addForeignKeyConstraint:
            baseTableName: workspaces
            baseColumnNames: created_by
            constraintName: fk_workspaces_creator
            referencedTableName: accounts
            referencedColumnNames: account_id
            onDelete: SET NULL

        # Workspace members table
        - createTable:
            tableName: workspace_members
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
              - column:
                  name: workspace_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: account_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ws_role_id
                  type: INT
                  constraints:
                    nullable: false
              - column:
                  name: joined_at
                  type: BIGINT
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true

            modifySql:
              dbms: mysql
              append:
                value: " ENGINE=InnoDB DEFAULT CHARSET=utf8mb4 COLLATE=utf8mb4_unicode_ci"

        - addUniqueConstraint:
            tableName: workspace_members
            columnNames: workspace_id, account_id
            constraintName: uk_ws_user

        - addForeignKeyConstraint:
            baseTableName: workspace_members
            baseColumnNames: workspace_id
            constraintName: fk_ws_members_workspace
            referencedTableName: workspaces
            referencedColumnNames: workspace_id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: workspace_members
            baseColumnNames: account_id
            constraintName: fk_ws_members_account
            referencedTableName: accounts
            referencedColumnNames: account_id
            onDelete: CASCADE

        - addForeignKeyConstraint:
            baseTableName: workspace_members
            baseColumnNames: ws_role_id
            constraintName: fk_ws_members_role
            referencedTableName: workspace_roles
            referencedColumnNames: ws_role_id